apiVersion: playground/v1
kind: Lab
metadata:
  name: barak-deploy-cross-vm
  description: |
    Two-VM lab for the barak-deploy cross-VM ship-and-deploy test. The
    lab itself is barak-deploy-agnostic — it just provisions two
    `docker-host` VMs on an isolated network. All barak-deploy and
    docker-tunneler installation happens at test-runtime via
    `scripts/install-{source,target}.sh` from this repo; the playground
    project knows nothing about either tool.

    To use: copy this file into `<playground-repo>/config/labs/` and
    run `playground apply barak-deploy-cross-vm` from that repo.

  tags: [barak-deploy, cross-vm]

spec:
  backend: local-libvirt

  networks:
    - name: deploy-net
      profile: isolated
      cidr: 10.20.40.0/24

  vms:
    - name: central
      role: docker-host
      networks:
        - name: deploy-net
          ip: 10.20.40.20

    - name: target
      role: docker-host
      networks:
        - name: deploy-net
          ip: 10.20.40.21

  providers:
    local-libvirt:
      uri: qemu:///system
      pool: default
