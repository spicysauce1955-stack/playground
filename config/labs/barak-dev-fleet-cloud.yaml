# barak-dev-fleet-cloud — 3-VM cloud lab for the barak-deploy continuous-usage
# soak test: simulates 3 independent developers (maya, tariq, lena), each
# deploying + continuously updating their own containerized component on
# their own remote Droplet via barak-deploy triggers/watch.
#
# The lab is barak-deploy-agnostic — it just provisions three docker-host
# Droplets. All barak-deploy install/config happens at test-runtime.
apiVersion: playground/v1
kind: Lab
metadata:
  name: barak-dev-fleet-cloud
  description: |
    Three docker-host Droplets on DigitalOcean, one per simulated developer,
    for an extended barak-deploy continuous-work + trigger soak test.
  tags: [barak-deploy, cloud, soak]

spec:
  backend: cloud-digitalocean
  offline: false

  budget:
    mode: permissive
    max_vcpu: 6
    max_memory_mb: 6144
    max_disk_gb: 150
    max_vms: 3
    max_containers: 30

  networks:
    - name: lab-net
      profile: nat
      cidr: 10.61.0.0/24

  vms:
    - name: maya
      role: docker-host
      networks: [lab-net]
      resources:
        vcpu: 1
        memory_mb: 1024
        disk_gb: 25

    - name: tariq
      role: docker-host
      networks: [lab-net]
      resources:
        vcpu: 1
        memory_mb: 1024
        disk_gb: 25

    - name: lena
      role: docker-host
      networks: [lab-net]
      resources:
        vcpu: 1
        memory_mb: 1024
        disk_gb: 25

  providers:
    cloud-digitalocean:
      region: nyc3
      size: s-1vcpu-1gb
      firewall:
        ssh_cidrs: ["2a10:8012:f:7050:ef80:5dde:a01a:52b9/128"]
