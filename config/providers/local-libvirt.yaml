apiVersion: playground/v1
kind: ProviderConfig
metadata:
  name: local-libvirt
  description: Local KVM/libvirt provider driven by OpenTofu (dmacvicar/libvirt).

spec:
  driver: local-libvirt
  uri: qemu:///system
  pool: default

  network:
    default_mode: nat
    bridge_prefix: pgbr
    dns:
      enabled: true

  vm:
    cpu_mode: host-passthrough
    machine: q35
    firmware: bios
    cloud_init: true

  tofu:
    state_path: .playground/state/tofu
    provider: dmacvicar-libvirt

  capabilities:
    nested_virtualization: true
    privileged_containers: true
    # Redroid needs the guest kernel to load binder_linux (installed by the
    # redroid Ansible role from linux-modules-extra-<kernel>) and to run a
    # --privileged container. cpu_mode (host-passthrough by default) is
    # unrelated to binder -- it exposes host CPU virt extensions for nested
    # hypervisors, not kernel-module availability. See
    # docs/architecture/CONTRACTS.md, "Redroid needs binder, not nested
    # virtualization".
    redroid: true
