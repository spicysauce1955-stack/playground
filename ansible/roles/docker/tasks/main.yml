---
# Per-OS-family install. Debian/Ubuntu is the original path (debian.yml);
# RedHat covers Rocky/Alma 8 and 9 (redhat.yml). Facts come from the
# first play in site.yml (every later play runs gather_facts: no).
- name: Install Docker on the Debian family
  ansible.builtin.include_tasks: debian.yml
  when: ansible_os_family == 'Debian'

- name: Install Docker on the RedHat family
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_os_family == 'RedHat'

- name: Fail on an unsupported OS family
  ansible.builtin.fail:
    msg: >-
      The docker role supports the Debian and RedHat families; VM
      {{ inventory_hostname }} reports ansible_os_family
      {{ ansible_os_family }} ({{ ansible_distribution }}
      {{ ansible_distribution_version }}).
  when: ansible_os_family not in ['Debian', 'RedHat']
